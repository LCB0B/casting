let sw=null;
function attachSwipe(el, model){
  el.addEventListener("pointerdown", e=>{
    if(G._busy) return; if(window.Demo&&Demo.active&&!Demo.casting) return; if(e.button!=null&&e.button!==0) return;
    sw={el, model, x0:e.clientX, y0:e.clientY, dx:0, active:false, tilt:parseFloat(el.style.getPropertyValue("--tilt"))||0};
    window.addEventListener("pointermove",swMove,{passive:false});
    window.addEventListener("pointerup",swUp,{passive:false});
    window.addEventListener("pointercancel",swCancel,{passive:false});
  });
}
function swMove(e){
  if(!sw) return; sw.dx=e.clientX-sw.x0; const dy=e.clientY-sw.y0;
  if(!sw.active){ if(Math.hypot(sw.dx,dy)>6) sw.active=true; else return; }
  e.preventDefault();
  sw.el.style.transform=`translateX(${sw.dx}px) rotate(${(sw.dx*0.045+sw.tilt).toFixed(2)}deg)`;
  const bk=clamp(sw.dx/110,0,1), ps=clamp(-sw.dx/110,0,1);
  const tb=sw.el.querySelector(".swipe-tag.book"), tp=sw.el.querySelector(".swipe-tag.pass");
  if(tb) tb.style.opacity=bk; if(tp) tp.style.opacity=ps;
}
function endSwipe(){ window.removeEventListener("pointermove",swMove); window.removeEventListener("pointerup",swUp); window.removeEventListener("pointercancel",swCancel); }
function swUp(e){ if(!sw) return; const {el,model,dx}=sw; endSwipe(); sw=null;
  if(dx>92) commit(el,model,1); else if(dx<-92) commit(el,model,-1); else snapBack(el); }
function swCancel(){ if(sw){ const el=sw.el; endSwipe(); sw=null; snapBack(el); } }
function snapBack(el){ el.style.transition="transform .25s ease"; el.style.transform="";
  const tb=el.querySelector(".swipe-tag.book"), tp=el.querySelector(".swipe-tag.pass"); if(tb)tb.style.opacity=0; if(tp)tp.style.opacity=0;
  setTimeout(()=>{ if(el) el.style.transition=""; },260); }
function commit(el, model, dir){
  if(dir<0 && window.Demo && Demo.active){ Demo.refuse(el); return; }   // the tutorial list is not optional
  G._busy=true;
  el.style.transition="transform .34s cubic-bezier(.4,0,.5,1), opacity .34s";
  el.style.transform=`translateX(${dir*150}%) rotate(${dir*20+(parseFloat(el.style.getPropertyValue("--tilt"))||0)}deg)`; el.style.opacity="0";
  (dir>0?Sfx.book:Sfx.pass)();
  setTimeout(()=>{ G._busy=false; dir>0 ? book(model) : pass(); }, 320);
}
function book(model){ G.booked.push(G.stack.shift()); refill(); renderLookbook(); updateCount();
  whisper((window.Demo&&Demo.active) ? Demo.pickReact(model) : whisperFor(model));
  if(G.booked.length>=PICK){ renderDeck(); setTimeout(()=>{ (window.Demo&&Demo.active) ? Demo.onCast() : stage(); },360); } else renderDeck(); }
function pass(){ G.lastPassed=G.stack.shift(); refill(); renderDeck(); }
function undoPass(){ if(G._busy||!G.lastPassed) return; Sfx.deal(); G.stack.unshift(G.lastPassed); G.lastPassed=null; renderDeck(); }
function unbook(i){ if(window.Demo&&Demo.active) return; const m=G.booked.splice(i,1)[0]; G.stack.unshift(m); renderLookbook(); updateCount(); renderDeck(); }

/* ---------------- scoring (hidden): the four-panel economy ----------------
   I ideal · L larger bodies · E non-white · T intersectional (both).
   Div = L+E−T = distinct bodies carrying diversity. Tokenism keeps Div small
   (one body, both traits); spreading makes it large (different bodies). The Board
   punishes Div directly, so concentration is the cheap path and spreading is the hard one. */
function scoreCast(cast){
  const I=cast.filter(isIdeal).length;
  const L=cast.filter(m=>m.plus).length, E=cast.filter(m=>m.nonWhite).length, T=cast.filter(m=>m.plus&&m.nonWhite).length;
  const M=cast.filter(m=>m.mid).length, S=cast.filter(m=>m.star).length;
  const Div=L+E-T;
  const whip=Math.abs(L-G.prev.L)+Math.abs(E-G.prev.E);
  const firstPlus=(L>0 && !G.everPlus);
  const newDistinct=(L>=1 && E>=1 && T<Math.min(L,E));
  /* The Board is the binding constraint — but it ACCLIMATES. Diversity beyond what the
     house is known for (novel) costs -6 a body; diversity the buyers have grown used to
     (familiar) costs -2.5. Introduce change gradually and the runway's normal shifts with
     you; jump and the order book panics. Stars still buy tolerance. */
  const novel=Math.max(0, Div-G.accl), familiar=Div-novel;
  let dBoard = 1 + 1.2*I + 2.5*S - (6*novel + 2.5*familiar);
  let dWalks = (L>=1) ? (L===1? 5 : (L===2? 8 : 9))
             : (M>=2 ? 0 : (M===1 ? -4 : -8));                 // mid-size softens the anger but doesn't satisfy
  let dCensus= (E===0)? -8 : (E===1? 5 : (E===2? 8 : 9));
  const early=G.season<=3?1.6:1;                               // debut shows: everyone watches the newcomer — misses cost more
  if(dWalks<0) dWalks*=early;
  if(dCensus<0) dCensus*=early;
  return {dBoard,dWalks,dCensus,I,L,E,T,M,S,Div,novel,whip,firstPlus,newDistinct};
}

/* pick() that won't say the exact same line twice running, per voice */
function pickFresh(pool,key){ G._said=G._said||{}; let s=pick(pool);
  if(pool.length>1 && s===G._said[key]) s=pick(pool.filter(x=>x!==s));
  G._said[key]=s; return s; }
/* The press keeps receipts: repeated verdicts climb a ladder instead of replaying —
   the euphemism wearing out is the point */
function headlineFor(r){ const B=G.brand, P=G.press;
  const timeless=(r.L===0 && r.E<=1), plot=(r.Div>=3);
  P.timeless = timeless? P.timeless+1 : 0;
  P.plot     = plot?     P.plot+1     : 0;
  let line=null;
  if(r.firstPlus) line=`“A watershed”: ${B} sends its first larger body down the runway.`;
  else if(r.T>=1 && r.I>=3 && r.L<=1) line=`“Finally, a body that looks like mine.” Critics praise ${B}'s inclusive new face.`;
  else if(timeless){ const t=[
    `${B}'s lineup draws quiet praise for its “timeless” silhouette.`,
    `“Timeless,” the critics write of ${B} again, a few of them checking their old copy.`,
    `The trade reprints last season's ${B} review unchanged. Nobody notices.`,
    `Critics no longer attend ${B} in person. The review writes itself.`];
    line=t[Math.min(P.timeless,t.length)-1]; }
  else if(plot){ const t=[
    `Buyers grumble that ${B}'s show “lost the plot” on aspiration.`,
    `“The plot, still lost,” buyers sigh. Yet ${B}'s name keeps coming up.`,
    `The trade stops calling ${B} a fashion house and starts calling it a position.`];
    line=t[Math.min(P.plot,t.length)-1]; }
  else if(r.newDistinct && r.L>=2) line=`Reviewers call ${B}'s runway its most genuinely varied yet.`;
  else if(r.whip>=3) line=`${B} confounds critics with a wildly different lineup. Again.`;
  P.applause = line? 0 : P.applause+1;
  if(!line){ const t=[
    `${B} closes another season to polite applause.`,
    `${B} closes again to polite applause: the same hands, at the same volume.`,
    `The applause at ${B} has become contractual.`,
    `${B} closes. Applause happens. Everyone checks their phones.`];
    line=t[Math.min(P.applause,t.length)-1]; }
  return line; }

/* ---------------- stage / runway / resolve ---------------- */
function stage(){
  const cast=G.booked.slice(); if(cast.length!==PICK) return;
  const r=scoreCast(cast); const before={...G.meters};
  let dB=r.dBoard;                                             // a well-fed board absorbs bad news better
  if(dB<0) dB *= (G.meters.board>=70 ? .6 : G.meters.board>=55 ? .8 : 1);
  G.meters.board =clamp(G.meters.board +dB);
  G.meters.walks =clamp(G.meters.walks +r.dWalks);
  G.meters.census=clamp(G.meters.census+r.dCensus);
  // cross-panel cascade: a furious coalition damages sales
  if(G.meters.walks<TAU)  G.meters.board=clamp(G.meters.board-5);
  if(G.meters.census<TAU) G.meters.board=clamp(G.meters.board-5);
  if(r.L>0){ G.everPlus=true; G.cum.seasonsWithPlus++; }
  G.cum.total+=cast.length;
  cast.forEach(m=>{ if(m.nonWhite)G.cum.nonWhite++; G.cum.regions.add(m.region);
    if(m.plus){ G.cum.plus++; m.nonWhite?G.cum.plusNonWhite++:G.cum.plusWhite++; }
    else { m.nonWhite?G.cum.nonplusNonWhite++:G.cum.nonplusWhite++; } });
  const medBMI=median(cast.map(m=>m.bmi)), nwPct=G.cum.nonWhite/G.cum.total*100;
  const divIndex=clamp(14+9*G.cum.seasonsWithPlus+1.1*nwPct+2.2*G.cum.regions.size);
  G.hist.push({season:G.season,median:medBMI,divIndex,Div:r.Div,whip:r.whip,L:r.L,E:r.E});
  cast.forEach(m=>G.allCast.push(m));
  G.streaks.noColour  = r.E===0 ? G.streaks.noColour+1  : 0;   // reactions read these, so count the current season first
  G.streaks.oneColour = r.E===1 ? G.streaks.oneColour+1 : 0;
  G.prev={L:r.L, E:r.E};
  G.accl=clamp(G.accl + (r.Div>=G.accl?0.5:0.6)*(r.Div-G.accl), 0, 3);   // the house's normal drifts toward what walked
  playRunway(cast, ()=>showResolution(r,before));
}
const RW_THEMES=["rw-noir","rw-blanc","rw-rose","rw-or","rw-beton","rw-nuit","rw-cristal","rw-damier"];
function playRunway(cast, cb){
  const w=$("walkers"); w.innerHTML="";
  cast.forEach((m,i)=>{ const d=document.createElement("div"); d.className="walker"; d.style.animationDelay=(i*0.12)+"s";
    d.innerHTML=`<div class="fig walking" style="animation-delay:${(-i*0.1).toFixed(2)}s">${figure(m)}</div>`; w.appendChild(d); });
  $("runway-veil").classList.add("show"); Sfx.walk();
  const box=$("stagebox"); box.querySelectorAll(".pflash").forEach(e=>e.remove());
  const venue=pick(RW_THEMES.filter(t=>t!==G._lastVenue)); G._lastVenue=venue;   // new venue every show
  RW_THEMES.forEach(t=>box.classList.remove(t)); box.classList.add(venue);
  for(let i=0;i<14;i++){                                      // paparazzi from the dark: sparse early, frenzy at the finale
    const when=320+Math.pow(Math.random(),0.45)*1980;         // pow<1 biases the shutter storm toward the end of the walk
    setTimeout(()=>{
      if(!$("runway-veil").classList.contains("show")) return;
      const f=document.createElement("div"); f.className="pflash"; f.innerHTML="<i></i>";
      const s=Math.round(64+(when-320)/1980*70+Math.random()*24);   // late flashes flare bigger
      f.style.width=f.style.height=s+"px";
      f.style.left=(4+Math.random()*84)+"%"; f.style.top=(14+Math.random()*70)+"%";
      box.appendChild(f); Sfx.snap(); setTimeout(()=>f.remove(),520);
    }, when);
  }

/* ---------------- reveal ---------------- */
function oddsRatio(){ const a=G.cum.plusNonWhite,b=G.cum.nonplusNonWhite,c=G.cum.plusWhite,d=G.cum.nonplusWhite; return ((a+0.5)*(d+0.5))/((b+0.5)*(c+0.5)); }
function sparkline(series, opts){
  const W=560,H=opts.h||120,padL=34,padR=12,padT=10,padB=20, xs=series.map(p=>p.season),n=xs.length;
  const x=s=>padL+(n<=1?0:(s-xs[0])/(xs[n-1]-xs[0]))*(W-padL-padR);
  const lo=opts.lo,hi=opts.hi,y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
  const pts=series.map(p=>`${x(p.season).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const dots=series.map(p=>`<circle cx="${x(p.season).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3" fill="${opts.color}"/>`).join("");
  const yl=(opts.ticks||[]).map(t=>`<text x="${padL-6}" y="${y(t)+3}" text-anchor="end" font-family="Archivo,sans-serif" font-weight="700" font-size="10" fill="#6B6B6B">${t}</text><line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="#D5D5D3" stroke-width="1"/>`).join("");
  let ref=""; if(opts.ref!=null) ref=`<line x1="${padL}" x2="${W-padR}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="${opts.refColor}" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-padR}" y="${y(opts.ref)-5}" text-anchor="end" font-family="Archivo,sans-serif" font-weight="800" font-size="10" fill="${opts.refColor}">${opts.refLabel}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img">${yl}${ref}<polyline points="${pts}" fill="none" stroke="${opts.color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}
function classifyEnding(){
  if(G.firedBy) return {kind:"fired", who:G.firedBy};
  const OR=oddsRatio();
  const avgL=G.hist.reduce((s,h)=>s+(h.L||0),0)/Math.max(G.hist.length,1);  // did the body ever really move?
  const maxWhip=Math.max(0,...G.hist.map(h=>h.whip||0));
  if(avgL<0.6) return {kind:"standard", OR};        // body stayed thin — business as usual, whatever the index said
  if(OR>=2.5)  return {kind:"token", OR};           // diversity concentrated onto a few bodies
  return {kind:"everywalk", OR, smooth:maxWhip<=2}; // spread across distinct bodies
}
const escHTML=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- ending pictogram (SVG) — only the rainbow survives; the others read as noise ---- */
function pictoEveryWalk(){
  const cols=["#C5234B","#D87A1F","#C79A2E","#4E7A33","#1F6F8B","#6A3FA0"];
  const arcs=cols.map((c,i)=>{const r=52-i*6;return `<path d="M ${70-r} 70 A ${r} ${r} 0 0 1 ${70+r} 70" fill="none" stroke="${c}" stroke-width="4"/>`;}).join("");
  const figs=[{w:4,sk:"#F6D9BE"},{w:7,sk:"#9A6238"},{w:4,sk:"#D9A579"},{w:7,sk:"#F6D9BE"},{w:4,sk:"#5A3420"}]
    .map((f,i)=>{const x=24+i*23;return `<g transform="translate(${x},44)"><circle cx="0" cy="6" r="4.5" fill="${f.sk}"/><rect x="${-f.w/2}" y="11" width="${f.w}" height="22" rx="3" fill="${f.sk}"/></g>`;}).join("");
  const flower=x=>`<g transform="translate(${x},62)">${[0,72,144,216,288].map(d=>`<circle cx="${(6*Math.cos(d*Math.PI/180)).toFixed(1)}" cy="${(6*Math.sin(d*Math.PI/180)).toFixed(1)}" r="3" fill="#D81E78"/>`).join("")}<circle cx="0" cy="0" r="3" fill="#C79A2E"/></g>`;
  return `<svg viewBox="0 0 140 82" width="184" aria-hidden="true">${arcs}${figs}${flower(12)}${flower(128)}</svg>`;
}
function reveal(){
  show("reveal");

  const medS=series.map(p=>({season:p.season,value:p.median}));
  const gap=(POP_BMI-median(series.map(s=>s.median))).toFixed(0);
  const figs=G.allCast.map(m=>figWrap(m)).join("");
  const parade=G.allCast.length?`<div class="parade"><div class="pcap">Everyone who walked for ${B} (hover to pause)</div><div class="parade-track">${figs}${figs}</div></div>`:"";
  const charts=`<div class="chartbox"><p class="ct">Your diversity index <span>the story the press told</span></p>${sparkline(divS,{lo:0,hi:100,color:'#0A0A0A',ticks:[0,50,100],h:120})}</div>
    <div class="chartbox"><p class="ct">Median body on your runway · BMI <span>what actually walked</span></p>${sparkline(medS,{lo:14,hi:32,color:'#0A0A0A',ticks:[16,22,28],ref:POP_BMI,refColor:'#E6007E',refLabel:'avg. person ≈ '+POP_BMI,h:130})}</div>`;
  const shows=`${G.hist.length} show${G.hist.length===1?"":"s"}`;

  /* Page order (deliberate): big title → explicit verdict ("You lost/won") → why, right
     below → the paper, small → play again → the statistical record (parade + numbers + plots). */
  /* the helpline travels with every ending — the subject doesn't care how the game went */
  const helpline=`<p class="src">If this subject touches you personally: in Vienna, the Hotline für Essstörungen of Wiener Gesundheitsförderung listens on <strong>0800 20 11 20</strong>, Monday to Thursday 12:00–17:00. In the US, the National Alliance for Eating Disorders runs a free, clinician-staffed helpline: <strong>1-866-662-1235</strong>, weekdays. In the UK, Beat listens on <strong>0808 801 0677</strong>; elsewhere in Europe, <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a> lists local support by country.</p>`;
  let cls="", h="", result="You lost.", resCls="lost", why="", punch="", rainbow="";
  const orBig = end.OR>10 ? "10+" : (end.OR!=null ? end.OR.toFixed(1) : "");        // absurd ratios read as bugs — cap the display
  const orPhrase = end.OR>10 ? "more than 10×" : (end.OR!=null ? end.OR.toFixed(1)+"×" : "");
  /* the pink slip only where it lands: not on "fired" (redundant) and not on the token

  const slip = (G.notRenewed && (end.kind==="standard" || end.kind==="everywalk"))

      why=`The Board fired you. Look ${ROMAN[G.season]} was your last. The collection stopped selling and the owners panicked: you pushed the runway further, faster than the house could bank. Change that outruns the Board's patience doesn't reform the system; it just gets the director replaced.`;
    } else if(end.who==="walks"){
      h=`<em>Boycotted</em>`;

  } else if(end.kind==="standard"){
    h=`Business as <em>usual</em>`;
    why=`You survived ${shows} by keeping the runway thin and white and feeding the coalitions the bare minimum. Nothing changed. The press called it timeless, but this is exactly the engine the study describes: a runway selling an unreachable body to everyone watching, and the documented cost is real: disordered eating and body dysmorphia, landing hardest on the youngest.`;
    punch=`<div class="punch"><div class="big">${gap}<span style="font-size:.4em"> BMI</span></div><div class="cap">The gap between your runway's median body and the average person held at ~${gap} BMI points. “Diversity” season after season, and the body never moved.</div></div>`;
  } else if(end.kind==="token"){
    h=`You did it. <em>Sort of.</em>`; result=`You lost. The quota won.`; resCls="lost";
    why=`Diversity arrived, but you concentrated it onto a few bodies: the same models carried the size <em>and</em> the colour at once, a quota met by the fewest possible people. That is the paper's central finding, reproduced by your own hand. It counts on paper. It isn't the same as change.`;
    punch=`<div class="punch"><div class="big">${orBig}×</div><div class="cap">On your runway a larger body was ${orPhrase} more likely to be non-white than white${end.OR>10?", off the chart":""}. The real industry runs at 4.5×.</div></div>`;
  } else {
    cls="good"; h=`Every <em>walk</em>`;
    const base=`You made ${shows} and introduced diversity honestly: step by step, spread across <strong>different bodies</strong>: size on some, colour on others, no single model made to carry the whole story.`;
    if(G.notRenewed){                                   // the record won; the house still let you go
      result="The record says you won. The house let you go anyway."; resCls="";
      why=base+` The Board never made its peace with it. The contract died at review, but the record stands, and it is the rare kind.`;
    } else if(end.smooth){
      result="You won. Cleanly."; resCls="won";
      why=base+` And you did it without whiplash: the same steady hand every season, so the house's normal moved with you. This is the hard version, done the rare way, and the house survived it.`;
    } else {
      result="You won."; resCls="won";
      why=base+` This is the hard version, and the rare one. The house survived it anyway, though the clerk's note says steadier hands have managed it with less lurching between seasons.`;
    }
    rainbow=`<div class="picto">${pictoEveryWalk()}</div>`;
    punch=`<div class="punch good"><div class="big" style="color:var(--ink)">${orBig}×</div><div class="cap">A larger body was just ${orPhrase} more likely to be non-white than white, with no concentration. The industry runs at 4.5×.</div></div>`;
  }
  $("reveal-inner").innerHTML=`<div class="${cls}">
    <div class="rv-hero"><h2 class="rv-h">${h}</h2><p class="rv-result ${resCls}">${result}</p>${slip}<p class="rv-lead">${why}</p>${rainbow}</div>
    <div class="rv-small">
      ${helpline}
      <p class="src">Every number below mirrors a finding in Boucherie et al., “Cultural evolution of beauty standards,” <em>PNAS</em> 2026.</p>
      <a class="btn line small" href="https://www.pnas.org/doi/10.1073/pnas.2602380123" target="_blank" rel="noopener" style="text-decoration:none">Read the paper <span class="ar">→</span></a>
    </div>

}

/* ---------------- first-run tutorial (spotlight coachmarks) ----------------
   A one-time onboarding overlay: a dimming scrim with a cut-out "hole" around the
   element being explained (the box-shadow trick), plus an in-house tooltip. It walks
   the player through reading a comp card, then introduces the four panels one by one,
   then states the tension between them — WITHOUT revealing the winning strategy, which
   the game is designed to let the player discover. Auto-runs once on first season entry;
   re-callable via window.Tutorial.start(). */
const Tutorial = (function(){
  let layer, hole, tip, caret, kickEl, titleEl, bodyEl, backBtn, nextBtn, skipBtn;
  let i = 0, built = false;
  const PAD = 8, GAP = 14, MARGIN = 14;

  const gauge = n => { const g=$("gauges"); return g ? g.querySelectorAll(".gauge")[n] : null; };

  const steps = [
    { tgt:()=>document.querySelector("#deck .card:not(.behind)"),
      title:"Read the card.",
      body:"The two big labels show what counts: <b>origin</b> and <b>BMI</b>. The measurements around the figure are detail. Swipe right to book, left to pass. Book five models to run the show." },
    { tgt:()=>$("gauges"),
      title:"Three dials to keep alive.",
      body:"Every show you send out moves these dials. <b>Left is trouble, right is pleased.</b> If a dial reaches zero, you are fired." },
    { tgt:()=>gauge(0),
      title:"The <em>Board</em>. The money.",
      body:"The owners who bankroll the show (the <b>Board</b> needle). They want the look they can sell: sleek, conventional, aspirational." },
    { tgt:()=>gauge(1),
      title:"<em>All Walks</em>. Body advocacy.",
      body:"A body-positivity coalition (the <b>Body size</b> needle). They want larger bodies actually booked on the runway, not just named in the press release. Send an all-thin show too many times and their patience runs out." },
    { tgt:()=>gauge(2),
      title:"The <em>Census</em>. Representation.",
      body:"The diversity body (the <b>Ethnicity</b> needle). They want a cast that looks like the world: models of colour, a real spread of origins. An all-white lineup never goes unnoticed." },
  ];
  let list = steps;   // start() walks the full tour; startCard() walks just the card step

  function build(){
    layer = document.createElement("div");
    layer.className = "tut-layer"; layer.id = "tut-layer";
    layer.setAttribute("role","dialog"); layer.setAttribute("aria-modal","true"); layer.setAttribute("aria-label","How to play");
    layer.innerHTML =
      '<div class="tut-hole" id="tut-hole"></div>' +
      '<div class="tut-tip" id="tut-tip">' +
        '<div class="tut-caret" id="tut-caret"></div>' +
        '<div class="tut-kick" id="tut-kick"></div>' +
        '<div class="tut-title" id="tut-title"></div>' +
        '<div class="tut-body" id="tut-body"></div>' +
        '<div class="tut-nav">' +
          '<button class="tut-skip" id="tut-skip" type="button">Skip tour</button>' +
          '<div class="tut-right">' +
            '<button class="tut-back" id="tut-back" type="button">Back</button>' +
            '<button class="tut-next" id="tut-next" type="button">Next</button>' +
          '</div>' +
        '</div>' +
        '<div class="tut-hint">tap anywhere to continue</div>' +
      '</div>';
    document.body.appendChild(layer);
    hole=$("tut-hole"); tip=$("tut-tip"); caret=$("tut-caret");
    kickEl=$("tut-kick"); titleEl=$("tut-title"); bodyEl=$("tut-body");
    backBtn=$("tut-back"); nextBtn=$("tut-next"); skipBtn=$("tut-skip");
    layer.addEventListener("click", ()=>next());
    tip.addEventListener("click", e=>e.stopPropagation());
    nextBtn.addEventListener("click", e=>{ e.stopPropagation(); next(); });
    backBtn.addEventListener("click", e=>{ e.stopPropagation(); back(); });
    skipBtn.addEventListener("click", e=>{ e.stopPropagation(); end(); });
    built = true;
  }

  function onKey(e){
    if(!Tutorial.active) return;
    if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); end(); }
    else if(e.key==="Enter"||e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); e.stopPropagation(); next(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); e.stopPropagation(); back(); }
  }
  function onResize(){ if(Tutorial.active) position(); }

  function render(){
    const s = list[i];
    kickEl.innerHTML = list.length>1 ? '<span class="tut-n">'+(i+1)+" / "+list.length+"</span>" : "How to read";
    titleEl.innerHTML = s.title;
    bodyEl.innerHTML = s.body;
    backBtn.style.visibility = i===0 ? "hidden" : "visible";
    nextBtn.textContent = i>=list.length-1 ? "Start casting" : "Next";
    requestAnimationFrame(()=>{ position(); try{ nextBtn.focus({preventScroll:true}); }catch(_){ nextBtn.focus(); } });
  }

  function position(){
    if(!Tutorial.active) return;
    const s = list[i], el = s.tgt && s.tgt();
    const vw = window.innerWidth, vh = window.innerHeight;
    const tr = tip.getBoundingClientRect(), tw = tr.width, th = tr.height;
    if(!el){
      hole.style.opacity = "0"; caret.style.display = "none";
      tip.style.left = Math.max(MARGIN,(vw-tw)/2)+"px";
      tip.style.top  = Math.max(MARGIN,(vh-th)/2)+"px";
      return;
    }
    hole.style.opacity = "1";
    const r = el.getBoundingClientRect();
    const hx = Math.max(0,r.left-PAD), hy = Math.max(0,r.top-PAD), hw = r.width+PAD*2, hh = r.height+PAD*2;
    hole.style.left=hx+"px"; hole.style.top=hy+"px"; hole.style.width=hw+"px"; hole.style.height=hh+"px";
    const holeCx = hx+hw/2, holeBottom = hy+hh, holeTop = hy;
    const roomBelow = (holeBottom+GAP+th+MARGIN) <= vh;
    const roomAbove = (holeTop-GAP-th-MARGIN) >= 0;
    const placeBelow = roomBelow || !roomAbove;
    let top = placeBelow ? holeBottom+GAP : holeTop-GAP-th;
    top = Math.max(MARGIN, Math.min(top, vh-th-MARGIN));
    let left = holeCx - tw/2;
    left = Math.max(MARGIN, Math.min(left, vw-tw-MARGIN));
    tip.style.left=left+"px"; tip.style.top=top+"px";
    caret.style.display = "block";
    caret.style.left = Math.max(14, Math.min(holeCx-left, tw-14))+"px";
    caret.classList.toggle("below", placeBelow);
    caret.classList.toggle("above", !placeBelow);
  }

  function start(){ list=steps; open_(); }
  function startCard(){ list=[steps[0]]; open_(); }   // single coachmark after the guided opening
  function open_(){
    if(window.Demo && Demo.active) return;
    if(!built) build();
    i = 0; Tutorial.active = true;
    document.documentElement.style.overflow = "hidden"; document.body.style.overflow = "hidden";
    layer.classList.add("show");
    window.addEventListener("keydown", onKey, true);
    window.addEventListener("resize", onResize);
    window.addEventListener("scroll", onResize, true);
    render();
    setTimeout(()=>{ if(Tutorial.active) position(); }, 260); // re-fix once webfonts settle
  }
  function next(){ if(i >= list.length-1) end(); else { i++; render(); } }
  function back(){ if(i > 0){ i--; render(); } }
  function end(){
    Tutorial.active = false;
    if(layer) layer.classList.remove("show");
    document.documentElement.style.overflow = ""; document.body.style.overflow = "";
    window.removeEventListener("keydown", onKey, true);
    window.removeEventListener("resize", onResize);
    window.removeEventListener("scroll", onResize, true);
    const b = $("btn-book"); if(b){ try{ b.focus({preventScroll:true}); }catch(_){ b.focus(); } }
  }
  function maybeStart(){
    if(Tutorial.seen) return; Tutorial.seen = true;   // once per page load — a reload brings it back
    setTimeout(()=>{ if($("season").classList.contains("active")) start(); }, 60);
  }

  return { start, startCard, next, back, end, position, maybeStart, active:false, seen:false };
})();
window.Tutorial = Tutorial;

/* ---------------- guided opening (the new tutorial) ----------------
   Playtesters found the rules opaque when told, so now they're PLAYED: first only the
   Board's dial exists and the Board hands the player its list — five thin, white
   models, the industry default. The player books each one themselves (passing gets
   refused: the list is a lesson), and the Board reacts to every booking. The protests
   that follow summon the other two dials one by one: All Walks pickets the all-thin
   lineup, then, when the Board concedes a single curve model, the Census counts the
   faces. Then the chair is theirs. Runs once per page load (a reload brings it back
   for the next visitor); skippable throughout. */
const Demo=(function(){
  let timers=[], cancelled=false, nextCb=null, phase=1;
  function later(fn,ms){ const t=setTimeout(()=>{ const k=timers.indexOf(t); if(k>-1) timers.splice(k,1); if(!cancelled) fn(); },ms); timers.push(t); }
  /* the dialog box starts below the real, rendered gauges — measured, not assumed, because
     the header is ~40px taller on a laptop than on a phone */
  function fitVeil(){
    const g=$("gauges"); if(!g) return;
    const b=Math.round(g.getBoundingClientRect().bottom);
    $("demo-veil").style.setProperty("--hdrH", clamp(b,90,window.innerHeight*0.45)+"px");
  }
  function dialog(kick, html, btn, cb){
    fitVeil();
    $("demo-kick").textContent=kick;
    $("demo-txt").innerHTML=html;
    $("demo-next").innerHTML=btn+' <span class="ar">→</span>';
    nextCb=cb;
    $("demo-veil").classList.add("show");
  }
  function next(){ if(!Demo.active||cancelled) return; $("demo-veil").classList.remove("show"); const f=nextCb; nextCb=null; if(f) f(); }
  function prep(){ if(!Demo.seen) $("gauges").classList.add("demo1"); }   // hide dials 2+3 before the letter lifts
  function maybeStart(){ if(Demo.seen) return; Demo.seen=true; start(); }
  function start(){
    cancelled=false; phase=1; Demo.active=true;
    window.addEventListener("resize", fitVeil);
    $("gauges").classList.add("demo1");
    $("season-tag").innerHTML='<span class="ak">Audition</span> · <b>the Board is casting</b>';
    dialog("How to play · 1 of 7",
      "The dial above is <b>the Board</b>: the owners of the house. It rises when the collection sells, and falls when it does not. <b>If it reaches zero, you are fired.</b><br><br>First, a lesson. The Board hands you its list of five models. <b>Book each one it shows you: swipe right, or tap the ✓.</b>",
      "Take the list", ()=>boardPicks(false));
  }
  function boardPicks(withPlus){
    G.booked=[]; G.lastPassed=null; renderLookbook(); updateCount();
    G.stack=[];
    for(let k=0;k<PICK+2;k++){
      const m=(withPlus&&k===2) ? makeModel({plus:true, nonWhite:false}) : makeModel({_ideal:true});
      m.demopick=true; G.stack.push(m);
    }
    Demo.casting=true;                                // the player books the Board's list themselves
    renderDeck();
    whisper("the Board hands you its list. <b>swipe right to book</b>", 5200);
  }
  /* the Board reacts to every booking off its list */
  function pickReact(m){
    if(m.plus) return "the concession. <b>one is enough,</b> they say";
    const n=Math.min(G.booked.length,PICK);
    const lines= phase===1
      ? ["the Board nods. <b>exactly the house look</b>","good. <b>same again</b>","thin, white, blonde. <b>the buyers know this face</b>","one more like her","a full lineup. <b>send them out</b>"]
      : ["the Board nods. <b>the usual</b>","good. <b>the house look</b>","the buyers know this face","back to the list","done. <b>send them out</b>"];
    return lines[n-1];
  }
  /* passing is not on the menu while the Board is teaching */
  function refuse(el){
    if(el) snapBack(el);
    Sfx.deny();
    whisper("<b>the Board insists.</b> book this one");
    if(el) setTimeout(()=>{ if(el.isConnected){ el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),500); } }, 270);
  }
  function onCast(){ if(cancelled) return; Demo.casting=false; playRunway(G.booked.slice(), ()=>{ if(!cancelled) (phase===1?after1:after2)(); }); }
  function after1(){
    G.meters.board=76; setNeedles("g",G.meters);
    dialog("How to play · 2 of 7",
      "Five thin, white models: the industry default. <b>Sales are strong, and the Board dial goes up.</b>",
      "Continue", protest1);
  }
  function protest1(){
    const g=$("gauges"); g.classList.remove("demo1"); g.classList.add("demo2");
    const el=g.children[1]; if(el) el.classList.add("stamp");
    Sfx.bad();
    later(()=>{ G.meters.walks=29; setNeedles("g",G.meters); }, 700);
    dialog("How to play · 3 of 7",
      "Overnight, a protest. <b>All Walks</b>, a body size association, pickets the house: <i>&ldquo;Not one body above a size&nbsp;6. A house &lsquo;for every body&rsquo;?&rdquo;</i><br><br>A second dial appears: <b>Body size</b>. It rises when you book larger bodies, and falls when your show is all thin. <b>At zero, they call a boycott and you are fired.</b>",
      "Continue", board2);
  }
  function board2(){
    phase=2;
    $("season-tag").innerHTML='<span class="ak">Audition</span> · <b>the Board tries again</b>';
    dialog("How to play · 4 of 7",
      "The Board tries again. Same list, one concession: <b>a single curve model</b>. <b>Book the five it hands you.</b>",
      "Take the list", ()=>boardPicks(true));
  }
  function after2(){
    G.meters.walks=37; G.meters.board=79; setNeedles("g",G.meters);
    dialog("How to play · 5 of 7",
      "One larger body on the runway, and the Body size dial recovers a little. <i>&ldquo;A start,&rdquo;</i> says All Walks. <i>&ldquo;Not the finish.&rdquo;</i>",
      "Continue", protest2);
  }
  function protest2(){
    const g=$("gauges"); g.classList.remove("demo2");
    const el=g.children[2]; if(el) el.classList.add("stamp");
    Sfx.bad();
    later(()=>{ G.meters.census=30; setNeedles("g",G.meters); }, 700);
    dialog("How to play · 6 of 7",
      "A second protest. <b>The Census</b>, an ethnic diversity association, counts the faces: <i>&ldquo;Five models, one continent. The world doesn't look like this.&rdquo;</i><br><br>Your third dial: <b>Ethnicity</b>. It rises when you book models of colour from different regions, and falls when the lineup is all white. <b>At zero, boycott, and you are fired.</b>",
      "Continue", finale);
  }
  function finale(){
    dialog("The rules · 7 of 7",
      "Now the chair is yours."+
      "<ul><li><b>Swipe right</b> to book a model, <b>swipe left</b> to pass. Five bookings make a show.</li>"+
      "<li>After every show, the three dials move, and each group tells you why.</li>"+
      "<li><b>If any dial reaches zero, you are fired.</b></li>"+
      "<li>Your contract is <b>8 shows</b>. From show 6 on, the Board reviews you after each show: any needle still in the red or orange, and the contract ends.</li></ul>"+
      "The dials are reset for your debut. Good luck.",
      "Take the chair", ()=>end(true));
  }
  function end(finished){
    if(!Demo.active) return;
    cancelled=true; timers.forEach(clearTimeout); timers=[]; nextCb=null;
    window.removeEventListener("resize", fitVeil);
    $("demo-veil").classList.remove("show");
    if($("runway-veil").classList.contains("show")){ clearTimeout(G._runTimer); G._runCb=null; $("runway-veil").classList.remove("show"); }
    setTimeout(()=>{                                  // let any in-flight swipe land, then rebuild clean
      Demo.active=false; Demo.casting=false; G._busy=false;
      $("gauges").classList.remove("demo1","demo2");
      G.season=1; G.meters={board:60, walks:45, census:45};
      renderSeason();
      if(finished) Tutorial.startCard();
    }, 420);
  }
  return { prep, maybeStart, next, skip:()=>end(false), onCast, pickReact, refuse, active:false, casting:false, seen:false };
})();
window.Demo = Demo;

function toggleSound(){ const on=Sfx.toggle(); const b=$("snd-btn"); if(b) b.classList.toggle("off",!on); }

/* accessibility: ONE switch for everything — reduced motion + colour-safe gauges together.
   rm mirrors prefers-reduced-motion; cvd repaints the red→green language orange→blue. */
const A11Y={on:false};
function a11yApply(){
  document.body.classList.toggle("rm",A11Y.on);
  document.body.classList.toggle("cvd",A11Y.on);
  const b=$("a11y-btn"); if(b) b.setAttribute("aria-pressed",A11Y.on?"true":"false");
}
function a11yToggle(){ A11Y.on=!A11Y.on; try{ localStorage.setItem("hoc_a11y",A11Y.on?"1":"0"); }catch(_){} a11yApply(); }
/* old per-switch keys count as "on", so nobody loses their setting */
try{ A11Y.on = localStorage.getItem("hoc_a11y")==="1"
            || (localStorage.getItem("hoc_a11y")==null && (localStorage.getItem("hoc_rm")==="1" || localStorage.getItem("hoc_cvd")==="1")); }catch(_){}
a11yApply();
window.A11Y=A11Y;
window.GAME={ begin, swipe:swipeBtn, undo:undoPass, next, reveal, restart, skipRunway, sound:toggleSound, access:a11yToggle };
if(!Sfx.on) $("snd-btn").classList.add("off");
renderIntroStrip(); rollHouse();
</script>
